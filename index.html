<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christian & Katie's Dinner & Grocery Planner</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#10B981',
                        secondary: '#4F46E5',
                        accent: '#F59E0B'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 pb-24 font-sans select-none">

    <!-- Header -->
    <header class="bg-emerald-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-utensils"></i> Christian & Katie
            </h1>
            <div id="sync-status" class="text-xs bg-emerald-700 px-2.5 py-1 rounded-full flex items-center gap-1.5 shadow-inner">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse" id="sync-dot"></span>
                <span id="sync-text">Connecting...</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 pt-4">

        <!-- Tab Navigation -->
        <div class="flex bg-white rounded-xl shadow-sm p-1 mb-5 border border-gray-100">
            <button onclick="switchTab('planner')" id="btn-planner" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 flex items-center justify-center gap-2 bg-emerald-600 text-white shadow-sm">
                <i class="fa-solid fa-calendar-days"></i> Dinners
            </button>
            <button onclick="switchTab('recipes')" id="btn-recipes" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 flex items-center justify-center gap-2 text-gray-600 hover:text-gray-900">
                <i class="fa-solid fa-book-open"></i> Recipes
            </button>
            <button onclick="switchTab('grocery')" id="btn-grocery" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 flex items-center justify-center gap-2 text-gray-600 hover:text-gray-900">
                <i class="fa-solid fa-cart-shopping"></i> Grocery <span id="grocery-badge" class="bg-emerald-100 text-emerald-800 text-xs px-1.5 py-0.2 rounded-full ml-0.5 font-bold">0</span>
            </button>
        </div>

        <!-- TAB 1: DINNER PLANNER -->
        <div id="tab-planner" class="space-y-4">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-lg font-bold text-gray-800">Weekly Dinner Schedule</h2>
                <span class="text-xs text-gray-500 bg-white px-2 py-1 rounded-md border">Assigned to Christian / Katie / Both</span>
            </div>
            <div id="days-container" class="space-y-3">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- TAB 2: RECIPES -->
        <div id="tab-recipes" class="hidden space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-gray-800">Healthy Recipes & Sides</h2>
                <button onclick="openAddRecipeModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-plus"></i> Add Recipe
                </button>
            </div>
            
            <div class="flex gap-2 overflow-x-auto pb-1 text-xs">
                <button onclick="filterRecipes('all')" id="filter-all" class="recipe-filter-btn px-3 py-1.5 rounded-full font-medium bg-emerald-600 text-white shadow-sm whitespace-nowrap">All Items</button>
                <button onclick="filterRecipes('Main')" id="filter-Main" class="recipe-filter-btn px-3 py-1.5 rounded-full font-medium bg-white text-gray-600 border whitespace-nowrap">Main Dishes</button>
                <button onclick="filterRecipes('Side')" id="filter-Side" class="recipe-filter-btn px-3 py-1.5 rounded-full font-medium bg-white text-gray-600 border whitespace-nowrap">Side Dishes</button>
            </div>

            <div id="recipes-container" class="space-y-3">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- TAB 3: GROCERY LIST -->
        <div id="tab-grocery" class="hidden space-y-4">
            <!-- Add Custom Grocery Item Box (Smart Auto-Categorized) -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-3">
                <div>
                    <h2 class="text-lg font-bold text-gray-800">Shopping List</h2>
                    <p class="text-xs text-gray-500">Auto-generated from dinners + custom items</p>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="custom-grocery-name" placeholder="Type item (e.g., Milk, Coffee, Apples)..." class="flex-1 px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" onkeypress="if(event.key === 'Enter') addCustomGrocery()">
                    <button onclick="addCustomGrocery()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow transition flex items-center gap-1.5 whitespace-nowrap">
                        <i class="fa-solid fa-plus"></i> Add
                    </button>
                </div>
                <div class="flex gap-2 flex-wrap pt-1 border-t border-gray-100">
                    <button onclick="toggleAllGroceries(true)" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold px-2.5 py-1.5 rounded-lg border transition">
                        Check All
                    </button>
                    <button onclick="toggleAllGroceries(false)" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold px-2.5 py-1.5 rounded-lg border transition">
                        Uncheck All
                    </button>
                    <button onclick="clearCheckedGroceries()" class="text-xs bg-red-50 hover:bg-red-100 text-red-700 font-semibold px-2.5 py-1.5 rounded-lg border border-red-200 transition ml-auto">
                        <i class="fa-solid fa-trash-can mr-1"></i> Clear Checked
                    </button>
                </div>
            </div>

            <div id="grocery-container" class="space-y-4 pb-12">
                <!-- Injected via JS -->
            </div>
        </div>

    </main>

    <!-- MODAL: Assign Recipes to Day -->
    <div id="assign-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden animate-slide-up">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <div>
                    <h3 id="modal-day-title" class="font-bold text-gray-800 text-lg">Assign Dinner</h3>
                    <p class="text-xs text-gray-500">Select recipes and chef for the night</p>
                </div>
                <button onclick="closeAssignModal()" class="w-8 h-8 rounded-full bg-gray-200 hover:bg-gray-300 flex items-center justify-center text-gray-700">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="p-4 space-y-4 overflow-y-auto flex-1">
                <!-- Chef assignment -->
                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-2">Who's Cooking / Responsible?</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" onclick="setModalChef('Christian')" id="chef-Christian" class="chef-btn py-2 text-xs font-semibold rounded-lg border border-gray-200 bg-white text-gray-700 transition">Christian</button>
                        <button type="button" onclick="setModalChef('Katie')" id="chef-Katie" class="chef-btn py-2 text-xs font-semibold rounded-lg border border-gray-200 bg-white text-gray-700 transition">Katie</button>
                        <button type="button" onclick="setModalChef('Both')" id="chef-Both" class="chef-btn py-2 text-xs font-semibold rounded-lg border border-gray-200 bg-white text-gray-700 transition">Both</button>
                    </div>
                </div>

                <!-- Recipe selection checklist -->
                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-2">Select Main & Side Dishes</label>
                    <div id="modal-recipe-list" class="space-y-2 border rounded-xl p-2 max-h-60 overflow-y-auto bg-gray-50">
                        <!-- Injected via JS -->
                    </div>
                </div>
            </div>

            <div class="p-4 border-t bg-gray-50 flex gap-2">
                <button onclick="closeAssignModal()" class="flex-1 py-2.5 border border-gray-300 text-gray-700 font-semibold rounded-xl text-sm bg-white hover:bg-gray-100 transition">Cancel</button>
                <button onclick="saveDayAssignment()" class="flex-1 py-2.5 bg-emerald-600 text-white font-semibold rounded-xl text-sm shadow-md hover:bg-emerald-700 transition">Save Night</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Add Custom Recipe -->
    <div id="recipe-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h3 class="font-bold text-gray-800 text-lg">Add New Recipe</h3>
                <button onclick="closeAddRecipeModal()" class="w-8 h-8 rounded-full bg-gray-200 hover:bg-gray-300 flex items-center justify-center text-gray-700">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="p-4 space-y-3 overflow-y-auto flex-1">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Recipe Name</label>
                    <input type="text" id="new-recipe-name" placeholder="e.g., Lemon Herb Salmon" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Type</label>
                        <select id="new-recipe-type" class="w-full px-3 py-2 border rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="Main">Main Dish</option>
                            <option value="Side">Side Dish</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Category</label>
                        <select id="new-recipe-category" class="w-full px-3 py-2 border rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="Produce">Produce</option>
                            <option value="Meat & Seafood">Meat & Seafood</option>
                            <option value="Dairy & Refrigerated">Dairy & Refrigerated</option>
                            <option value="Pantry & Spices">Pantry & Spices</option>
                            <option value="Bakery">Bakery</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Ingredients (one per line or comma-separated)</label>
                    <textarea id="new-recipe-ingredients" rows="4" placeholder="e.g., Salmon fillets, Olive oil, Lemon, Garlic" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
                </div>
            </div>

            <div class="p-4 border-t bg-gray-50 flex gap-2">
                <button onclick="closeAddRecipeModal()" class="flex-1 py-2.5 border border-gray-300 text-gray-700 font-semibold rounded-xl text-sm bg-white">Cancel</button>
                <button onclick="saveNewRecipe()" class="flex-1 py-2.5 bg-emerald-600 text-white font-semibold rounded-xl text-sm shadow-md hover:bg-emerald-700">Save Recipe</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBg7TL-q9wl0XgHHTlKhPx89NH7gpkfGfg",
            authDomain: "dinnerplanner-eca16.firebaseapp.com",
            projectId: "dinnerplanner-eca16",
            storageBucket: "dinnerplanner-eca16.firebasestorage.app",
            messagingSenderId: "164924334581",
            appId: "1:164924334581:web:1009ff53cb99ca4d4240bc",
            measurementId: "G-BD2YLT2LM5"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Preloaded Healthy Recipes & Sides
        const initialRecipes = [
            { id: 'rec-1', name: 'Lemon Herb Grilled Chicken', type: 'Main', category: 'Meat & Seafood', ingredients: ['Chicken breasts (2 lbs)', 'Olive oil', 'Lemon juice', 'Garlic cloves (3)', 'Dried oregano'] },
            { id: 'rec-2', name: 'Garlic Butter Roasted Asparagus', type: 'Side', category: 'Produce', ingredients: ['Asparagus (1 bunch)', 'Butter (2 tbsp)', 'Minced garlic', 'Parmesan cheese'] },
            { id: 'rec-3', name: 'Baked Salmon with Quinoa', type: 'Main', category: 'Meat & Seafood', ingredients: ['Salmon fillets (2)', 'Quinoa (1 cup)', 'Broccoli florets (2 cups)', 'Olive oil', 'Soy sauce'] },
            { id: 'rec-4', name: 'Roasted Sweet Potato Cubes', type: 'Side', category: 'Produce', ingredients: ['Sweet potatoes (2)', 'Olive oil', 'Paprika', 'Salt & black pepper'] },
            { id: 'rec-5', name: 'Turkey Taco Lettuce Boats', type: 'Main', category: 'Meat & Seafood', ingredients: ['Ground turkey (1 lb)', 'Taco seasoning', 'Romaine lettuce (1 head)', 'Avocado (2)', 'Salsa'] },
            { id: 'rec-6', name: 'Cilantro Lime Cauliflower Rice', type: 'Side', category: 'Produce', ingredients: ['Cauliflower rice (1 bag)', 'Lime juice', 'Fresh cilantro', 'Olive oil'] },
            { id: 'rec-7', name: 'Grass-Fed Beef Stir-Fry', type: 'Main', category: 'Meat & Seafood', ingredients: ['Sliced flank steak (1 lb)', 'Bell peppers (2)', 'Snap peas (1 cup)', 'Soy sauce', 'Sesame oil', 'Fresh ginger'] },
            { id: 'rec-8', name: 'Steamed Jasmine Rice', type: 'Side', category: 'Pantry & Spices', ingredients: ['Jasmine rice (2 cups)', 'Chicken broth (sub for water)'] },
            { id: 'rec-9', name: 'Mediterranean Greek Salad', type: 'Main', category: 'Produce', ingredients: ['Cucumbers (2)', 'Roma tomatoes (4)', 'Kalamata olives', 'Feta cheese', 'Red onion', 'Extra virgin olive oil'] },
            { id: 'rec-10', name: 'Garlic Herb Roasted Zucchini', type: 'Side', category: 'Produce', ingredients: ['Zucchini (3)', 'Olive oil', 'Garlic powder', 'Parmesan cheese'] }
        ];

        const daysOfWeek = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

        // Default app state
        let appState = {
            recipes: initialRecipes,
            planner: {
                'Monday': { chef: 'Christian', recipeIds: ['rec-1', 'rec-2'] },
                'Tuesday': { chef: 'Katie', recipeIds: ['rec-3', 'rec-4'] },
                'Wednesday': { chef: 'Both', recipeIds: ['rec-5', 'rec-6'] },
                'Thursday': { chef: 'Christian', recipeIds: ['rec-7', 'rec-8'] },
                'Friday': { chef: 'Katie', recipeIds: ['rec-9', 'rec-10'] },
                'Saturday': { chef: 'Both', recipeIds: [] },
                'Sunday': { chef: 'Both', recipeIds: [] }
            },
            checkedGroceries: {},
            dismissedGroceries: {},
            customGroceries: []
        };

        let currentFilter = 'all';
        let activeModalDay = null;
        let modalSelectedChef = 'Both';
        let modalSelectedRecipeIds = [];

        // Smart Grocery Auto-Categorization Helper
        function autoCategorize(itemName) {
            const lower = itemName.toLowerCase();
            
            const produceKeywords = ['apple', 'banana', 'orange', 'lemon', 'lime', 'avocado', 'tomato', 'lettuce', 'spinach', 'onion', 'garlic', 'potato', 'cucumber', 'carrot', 'celery', 'berry', 'fruit', 'vegetable', 'cilantro', 'ginger', 'squash', 'zucchini', 'asparagus', 'mushroom', 'pepper', 'broccoli', 'cauliflower', 'herb', 'scallion', 'cabbage', 'kale', 'grape', 'peach', 'melon'];
            const meatKeywords = ['chicken', 'beef', 'steak', 'turkey', 'pork', 'bacon', 'salmon', 'shrimp', 'fish', 'meat', 'ground', 'sausage', 'lamb', 'chop', 'fillet', 'breast', 'thigh', 'patty'];
            const dairyKeywords = ['milk', 'cheese', 'butter', 'yogurt', 'cream', 'egg', 'sour cream', 'cottage cheese', 'parmesan', 'feta', 'mozzarella', 'cheddar', 'ice cream', 'almond milk', 'oat milk', 'half and half'];
            const bakeryKeywords = ['bread', 'bagel', 'tortilla', 'bun', 'roll', 'muffin', 'pita', 'croissant', 'pastry', 'naan', 'wrap', 'cake'];

            if (produceKeywords.some(kw => lower.includes(kw))) return 'Produce';
            if (meatKeywords.some(kw => lower.includes(kw))) return 'Meat & Seafood';
            if (dairyKeywords.some(kw => lower.includes(kw))) return 'Dairy & Refrigerated';
            if (bakeryKeywords.some(kw => lower.includes(kw))) return 'Bakery';
            
            return 'Pantry & Spices'; // default fallback for canned goods, coffee, paper towels, snacks, etc.
        }

        // Setup real-time listener with Firestore
        const docRef = doc(db, "appData", "sharedPlanner");

        // Listen for remote updates
        onSnapshot(docRef, (docSnap) => {
            const dot = document.getElementById('sync-dot');
            const text = document.getElementById('sync-text');
            
            if (docSnap.exists()) {
                appState = docSnap.data();
                if (!appState.dismissedGroceries) appState.dismissedGroceries = {};
                if (!appState.customGroceries) appState.customGroceries = [];
                dot.className = "w-2 h-2 rounded-full bg-emerald-400";
                text.innerText = "Synced";
            } else {
                setDoc(docRef, appState);
                dot.className = "w-2 h-2 rounded-full bg-emerald-400";
                text.innerText = "Synced";
            }
            renderAll();
        }, (error) => {
            console.error("Firebase sync error:", error);
            const dot = document.getElementById('sync-dot');
            const text = document.getElementById('sync-text');
            dot.className = "w-2 h-2 rounded-full bg-red-400";
            text.innerText = "Offline Mode";
        });

        // Save state to Firestore
        function saveToCloud() {
            setDoc(docRef, appState).catch((err) => {
                console.error("Error saving:", err);
            });
        }

        // Global functions exposed to window
        window.switchTab = function(tab) {
            ['planner', 'recipes', 'grocery'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`btn-${t}`).className = "flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 flex items-center justify-center gap-2 text-gray-600 hover:text-gray-900";
            });
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`btn-${tab}`).className = "flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 flex items-center justify-center gap-2 bg-emerald-600 text-white shadow-sm";
        };

        window.openAssignModal = function(day) {
            activeModalDay = day;
            const currentDayData = appState.planner[day] || { chef: 'Both', recipeIds: [] };
            modalSelectedChef = currentDayData.chef || 'Both';
            modalSelectedRecipeIds = [...(currentDayData.recipeIds || [])];

            document.getElementById('modal-day-title').innerText = `Assign: ${day}`;
            updateChefUI();
            renderModalRecipeList();
            document.getElementById('assign-modal').classList.remove('hidden');
        };

        window.closeAssignModal = function() {
            document.getElementById('assign-modal').classList.add('hidden');
            activeModalDay = null;
        };

        window.setModalChef = function(chef) {
            modalSelectedChef = chef;
            updateChefUI();
        };

        window.clearDayPlanner = function(day) {
            if (confirm(`Clear all dinner assignments for ${day}?`)) {
                appState.planner[day] = { chef: 'Both', recipeIds: [] };
                saveToCloud();
            }
        };

        function updateChefUI() {
            ['Christian', 'Katie', 'Both'].forEach(c => {
                const btn = document.getElementById(`chef-${c}`);
                if (c === modalSelectedChef) {
                    btn.className = "chef-btn py-2 text-xs font-semibold rounded-lg border-2 border-emerald-600 bg-emerald-50 text-emerald-800 shadow-sm transition";
                } else {
                    btn.className = "chef-btn py-2 text-xs font-semibold rounded-lg border border-gray-200 bg-white text-gray-700 transition";
                }
            });
        }

        function renderModalRecipeList() {
            const container = document.getElementById('modal-recipe-list');
            container.innerHTML = appState.recipes.map(r => {
                const isChecked = modalSelectedRecipeIds.includes(r.id);
                return `
                    <label class="flex items-center justify-between p-2 rounded-lg bg-white border ${isChecked ? 'border-emerald-500 bg-emerald-50/50' : 'border-gray-200'} cursor-pointer hover:border-gray-300">
                        <div class="flex items-center gap-2.5">
                            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleModalRecipe('${r.id}')" class="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500">
                            <div>
                                <span class="text-sm font-medium text-gray-800">${r.name}</span>
                                <span class="text-[10px] ml-2 px-1.5 py-0.5 rounded ${r.type === 'Main' ? 'bg-purple-100 text-purple-700' : 'bg-amber-100 text-amber-700'}">${r.type}</span>
                            </div>
                        </div>
                    </label>
                `;
            }).join('');
        }

        window.toggleModalRecipe = function(id) {
            if (modalSelectedRecipeIds.includes(id)) {
                modalSelectedRecipeIds = modalSelectedRecipeIds.filter(i => i !== id);
            } else {
                modalSelectedRecipeIds.push(id);
            }
            renderModalRecipeList();
        };

        window.saveDayAssignment = function() {
            if (!activeModalDay) return;
            appState.planner[activeModalDay] = {
                chef: modalSelectedChef,
                recipeIds: modalSelectedRecipeIds
            };
            saveToCloud();
            closeAssignModal();
        };

        window.openAddRecipeModal = function() {
            document.getElementById('new-recipe-name').value = '';
            document.getElementById('new-recipe-ingredients').value = '';
            document.getElementById('recipe-modal').classList.remove('hidden');
        };

        window.closeAddRecipeModal = function() {
            document.getElementById('recipe-modal').classList.add('hidden');
        };

        window.saveNewRecipe = function() {
            const name = document.getElementById('new-recipe-name').value.trim();
            const type = document.getElementById('new-recipe-type').value;
            const category = document.getElementById('new-recipe-category').value;
            const ingText = document.getElementById('new-recipe-ingredients').value.trim();

            if (!name) {
                alert('Please enter a recipe name.');
                return;
            }

            const ingredients = ingText ? ingText.split(/[\n,]+/).map(i => i.trim()).filter(Boolean) : [];
            const newRec = {
                id: 'rec-' + Date.now(),
                name,
                type,
                category,
                ingredients
            };

            appState.recipes.push(newRec);
            saveToCloud();
            closeAddRecipeModal();
        };

        window.deleteRecipe = function(id) {
            if (confirm('Delete this recipe? It will also be removed from any dinner nights using it.')) {
                appState.recipes = appState.recipes.filter(r => r.id !== id);
                Object.keys(appState.planner).forEach(day => {
                    if (appState.planner[day].recipeIds) {
                        appState.planner[day].recipeIds = appState.planner[day].recipeIds.filter(rId => rId !== id);
                    }
                });
                saveToCloud();
            }
        };

        window.filterRecipes = function(type) {
            currentFilter = type;
            document.querySelectorAll('.recipe-filter-btn').forEach(btn => {
                btn.className = "recipe-filter-btn px-3 py-1.5 rounded-full font-medium bg-white text-gray-600 border whitespace-nowrap";
            });
            document.getElementById(`filter-${type}`).className = "recipe-filter-btn px-3 py-1.5 rounded-full font-medium bg-emerald-600 text-white shadow-sm whitespace-nowrap";
            renderRecipes();
        };

        window.toggleGroceryItem = function(itemKey) {
            appState.checkedGroceries[itemKey] = !appState.checkedGroceries[itemKey];
            saveToCloud();
        };

        window.toggleAllGroceries = function(checkState) {
            const list = generateGroceryList();
            Object.values(list).forEach(items => {
                items.forEach(item => {
                    appState.checkedGroceries[item.key] = checkState;
                });
            });
            saveToCloud();
        };

        window.addCustomGrocery = function() {
            const nameInput = document.getElementById('custom-grocery-name');
            const name = nameInput.value.trim();
            if (!name) return;

            const category = autoCategorize(name);

            if (!appState.customGroceries) appState.customGroceries = [];
            appState.customGroceries.push({
                id: 'custom-' + Date.now(),
                name,
                category
            });

            nameInput.value = '';
            saveToCloud();
        };

        window.clearCheckedGroceries = function() {
            if (!appState.dismissedGroceries) appState.dismissedGroceries = {};
            
            const list = generateGroceryList();
            Object.values(list).forEach(items => {
                items.forEach(item => {
                    if (appState.checkedGroceries[item.key]) {
                        if (item.isCustom) {
                            appState.customGroceries = appState.customGroceries.filter(c => c.id !== item.customId);
                        } else {
                            appState.dismissedGroceries[item.key] = true;
                        }
                        delete appState.checkedGroceries[item.key];
                    }
                });
            });
            saveToCloud();
        };

        function generateGroceryList() {
            const categories = {
                'Produce': [],
                'Meat & Seafood': [],
                'Dairy & Refrigerated': [],
                'Pantry & Spices': [],
                'Bakery': []
            };

            // 1. Add recipe ingredients (auto-categorized by recipe category)
            const activeRecipeIds = new Set();
            Object.values(appState.planner).forEach(dayObj => {
                if (dayObj.recipeIds) {
                    dayObj.recipeIds.forEach(id => activeRecipeIds.add(id));
                }
            });

            activeRecipeIds.forEach(rId => {
                const recipe = appState.recipes.find(r => r.id === rId);
                if (recipe && recipe.ingredients) {
                    const cat = categories[recipe.category] ? recipe.category : 'Pantry & Spices';
                    recipe.ingredients.forEach(ing => {
                        const key = `${cat}___${ing.toLowerCase()}`;
                        if (!appState.dismissedGroceries || !appState.dismissedGroceries[key]) {
                            categories[cat].push({ name: ing, key, recipeName: recipe.name, isCustom: false });
                        }
                    });
                }
            });

            // 2. Add custom groceries (auto-categorized by keyword)
            if (appState.customGroceries) {
                appState.customGroceries.forEach(item => {
                    const cat = categories[item.category] ? item.category : 'Pantry & Spices';
                    const key = `custom___${item.id}`;
                    categories[cat].push({ name: item.name, key, recipeName: 'Extra Item', isCustom: true, customId: item.id });
                });
            }

            return categories;
        }

        function renderAll() {
            renderPlanner();
            renderRecipes();
            renderGrocery();
        }

        function renderPlanner() {
            const container = document.getElementById('days-container');
            container.innerHTML = daysOfWeek.map(day => {
                const dayData = appState.planner[day] || { chef: 'Both', recipeIds: [] };
                const chefColor = dayData.chef === 'Christian' ? 'bg-blue-100 text-blue-700 border-blue-200' :
                                  dayData.chef === 'Katie' ? 'bg-pink-100 text-pink-700 border-pink-200' : 
                                  'bg-amber-100 text-amber-700 border-amber-200';

                const recipesHtml = dayData.recipeIds && dayData.recipeIds.length > 0 ? 
                    dayData.recipeIds.map(rId => {
                        const rec = appState.recipes.find(r => r.id === rId);
                        if (!rec) return '';
                        const badgeColor = rec.type === 'Main' ? 'bg-purple-50 text-purple-700 border-purple-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200';
                        return `
                            <div class="flex items-center justify-between py-1.5 px-2.5 rounded-lg border ${badgeColor} text-xs mb-1">
                                <span class="font-medium truncate"><i class="fa-solid ${rec.type === 'Main' ? 'fa-bowl-food' : 'fa-carrot'} mr-1.5 opacity-75"></i>${rec.name}</span>
                                <span class="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded bg-white/60">${rec.type}</span>
                            </div>
                        `;
                    }).join('') : 
                    `<p class="text-xs text-gray-400 italic py-1">No recipes assigned yet.</p>`;

                return `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3.5 hover:border-gray-200 transition">
                        <div class="flex justify-between items-center mb-2.5">
                            <h3 class="font-bold text-gray-800 text-base">${day}</h3>
                            <div class="flex items-center gap-1.5">
                                <span class="text-xs px-2.5 py-0.5 rounded-full font-semibold border ${chefColor}">
                                    <i class="fa-solid fa-user text-[10px] mr-1"></i>${dayData.chef}
                                </span>
                                <button onclick="openAssignModal('${day}')" title="Edit Dinner" class="bg-gray-100 hover:bg-emerald-50 hover:text-emerald-600 text-gray-600 w-7 h-7 rounded-lg flex items-center justify-center transition shadow-xs">
                                    <i class="fa-solid fa-pen text-xs"></i>
                                </button>
                                <button onclick="clearDayPlanner('${day}')" title="Clear Day" class="bg-gray-100 hover:bg-red-50 hover:text-red-500 text-gray-400 w-7 h-7 rounded-lg flex items-center justify-center transition shadow-xs">
                                    <i class="fa-solid fa-rotate-left text-xs"></i>
                                </button>
                            </div>
                        </div>
                        <div class="space-y-1">
                            ${recipesHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderRecipes() {
            const container = document.getElementById('recipes-container');
            const filtered = appState.recipes.filter(r => currentFilter === 'all' || r.type === currentFilter);

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-gray-400 text-sm">No recipes found.</div>`;
                return;
            }

            container.innerHTML = filtered.map(r => `
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 relative group">
                    <div class="flex justify-between items-start mb-1.5">
                        <div>
                            <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded ${r.type === 'Main' ? 'bg-purple-100 text-purple-700' : 'bg-amber-100 text-amber-700'}">${r.type} Dish</span>
                            <span class="text-[10px] text-gray-500 ml-1.5"><i class="fa-solid fa-tag mr-1"></i>${r.category}</span>
                            <h3 class="font-bold text-gray-800 text-base mt-1">${r.name}</h3>
                        </div>
                        <button onclick="deleteRecipe('${r.id}')" class="text-gray-300 hover:text-red-500 p-1 transition">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                    <div class="mt-2 text-xs text-gray-600 bg-gray-50 p-2.5 rounded-lg border border-gray-100">
                        <span class="font-semibold block text-gray-700 mb-1"><i class="fa-solid fa-basket-shopping mr-1"></i> Ingredients:</span>
                        <ul class="list-disc list-inside space-y-0.5 text-gray-600">
                            ${r.ingredients && r.ingredients.length > 0 ? r.ingredients.map(ing => `<li>${ing}</li>`).join('') : '<li class="italic text-gray-400">No ingredients listed</li>'}
                        </ul>
                    </div>
                </div>
            `).join('');
        }

        function renderGrocery() {
            const container = document.getElementById('grocery-container');
            const list = generateGroceryList();
            
            let totalItems = 0;
            let checkedCount = 0;

            Object.values(list).forEach(items => {
                totalItems += items.length;
                items.forEach(item => {
                    if (appState.checkedGroceries[item.key]) checkedCount++;
                });
            });

            document.getElementById('grocery-badge').innerText = `${totalItems - checkedCount}`;

            const categoriesKeys = Object.keys(list);
            let hasAnyItems = totalItems > 0;

            if (!hasAnyItems) {
                container.innerHTML = `
                    <div class="bg-white rounded-xl p-8 text-center border border-gray-100 shadow-sm">
                        <i class="fa-solid fa-basket-shopping text-3xl text-gray-300 mb-2"></i>
                        <p class="text-gray-500 font-medium text-sm">Your grocery list is empty!</p>
                        <p class="text-gray-400 text-xs mt-1">Assign recipes or type custom items above.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = categoriesKeys.map(cat => {
                const items = list[cat];
                if (items.length === 0) return '';

                return `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div class="bg-gray-50 px-4 py-2.5 border-b border-gray-100 flex justify-between items-center">
                            <h3 class="font-bold text-gray-700 text-sm flex items-center gap-2">
                                <i class="fa-solid fa-folder-open text-emerald-600"></i> ${cat}
                            </h3>
                            <span class="text-xs text-gray-400 bg-white px-2 py-0.5 rounded-md border">${items.length} items</span>
                        </div>
                        <div class="divide-y divide-gray-50">
                            ${items.map(item => {
                                const isChecked = !!appState.checkedGroceries[item.key];
                                return `
                                    <label class="flex items-center justify-between px-4 py-3 cursor-pointer hover:bg-gray-50/80 transition ${isChecked ? 'bg-gray-50/50 opacity-60' : ''}">
                                        <div class="flex items-center gap-3">
                                            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleGroceryItem('${item.key}')" class="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500">
                                            <span class="text-sm ${isChecked ? 'line-through text-gray-400' : 'text-gray-800 font-medium'}">${item.name}</span>
                                        </div>
                                        <span class="text-[10px] text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full truncate max-w-[120px]">For: ${item.recipeName}</span>
                                    </label>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
